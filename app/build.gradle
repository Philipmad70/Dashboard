plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
}

android {
    namespace 'dk.philip.laesop'
    compileSdk 34

    defaultConfig {
        applicationId "dk.philip.laesop"
        minSdk 26
        targetSdk 34
        versionCode 6
        versionName "1.5"
    }

    // Fast nøgle, så nye versioner kan installeres oven på den gamle
    signingConfigs {
        fast {
            storeFile file('laesop.keystore')
            storePassword 'laesop123'
            keyAlias 'laesop'
            keyPassword 'laesop123'
        }
    }

    buildTypes {
        debug {
            signingConfig signingConfigs.fast
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    kotlinOptions {
        jvmTarget = '17'
    }
}

dependencies {
    implementation 'org.jetbrains.kotlin:kotlin-stdlib:1.9.24'
    // Tekstgenkendelse på telefonen (læser tekst i billeder, fx PDF'er)
    implementation 'com.google.mlkit:text-recognition:16.0.1'
}
